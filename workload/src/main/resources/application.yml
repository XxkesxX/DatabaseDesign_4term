server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: marketplace-workload
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/mydb}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_POOL_SIZE:20}
      minimum-idle: ${SPRING_DATASOURCE_MIN_IDLE:4}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

workload:
  sql-profile: ${WORKLOAD_SQL_PROFILE:optimized}
