version: '3.9'

services:
  etcd1:
    image: quay.io/coreos/etcd:v3.5.17
    container_name: etcd1
    hostname: etcd1
    restart: always
    command:
      - /usr/local/bin/etcd
      - --name=etcd1
      - --data-dir=/etcd-data
      - --initial-advertise-peer-urls=http://etcd1:2380
      - --listen-peer-urls=http://0.0.0.0:2380
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd1:2379
      - --initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      - --initial-cluster-token=pg-ha-etcd
      - --initial-cluster-state=new
    volumes:
      - etcd1-data:/etcd-data

  etcd2:
    image: quay.io/coreos/etcd:v3.5.17
    container_name: etcd2
    hostname: etcd2
    restart: always
    command:
      - /usr/local/bin/etcd
      - --name=etcd2
      - --data-dir=/etcd-data
      - --initial-advertise-peer-urls=http://etcd2:2380
      - --listen-peer-urls=http://0.0.0.0:2380
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd2:2379
      - --initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      - --initial-cluster-token=pg-ha-etcd
      - --initial-cluster-state=new
    volumes:
      - etcd2-data:/etcd-data

  etcd3:
    image: quay.io/coreos/etcd:v3.5.17
    container_name: etcd3
    hostname: etcd3
    restart: always
    command:
      - /usr/local/bin/etcd
      - --name=etcd3
      - --data-dir=/etcd-data
      - --initial-advertise-peer-urls=http://etcd3:2380
      - --listen-peer-urls=http://0.0.0.0:2380
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd3:2379
      - --initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      - --initial-cluster-token=pg-ha-etcd
      - --initial-cluster-state=new
    volumes:
      - etcd3-data:/etcd-data

  pg1:
    build: ./patroni
    container_name: pg1
    hostname: pg1
    restart: always
    command: >
      bash -c "mkdir -p /var/run/postgresql /var/lib/postgresql/data &&
               chown -R postgres:postgres /var/lib/postgresql /var/run/postgresql &&
               exec gosu postgres patroni /etc/patroni/patroni.yml"
    volumes:
      - ./patroni/pg1.yml:/etc/patroni/patroni.yml:ro
      - pg1-data:/var/lib/postgresql/data
    ports:
      - "8008:8008"
    depends_on:
      - etcd1
      - etcd2
      - etcd3

  pg2:
    build: ./patroni
    container_name: pg2
    hostname: pg2
    restart: always
    command: >
      bash -c "mkdir -p /var/run/postgresql /var/lib/postgresql/data &&
               chown -R postgres:postgres /var/lib/postgresql /var/run/postgresql &&
               exec gosu postgres patroni /etc/patroni/patroni.yml"
    volumes:
      - ./patroni/pg2.yml:/etc/patroni/patroni.yml:ro
      - pg2-data:/var/lib/postgresql/data
    ports:
      - "8009:8008"
    depends_on:
      - etcd1
      - etcd2
      - etcd3

  db:
    image: haproxy:2.9
    container_name: db
    hostname: db
    restart: always
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "${POSTGRES_PORT}:5432"
      - ":7000"
    depends_on:
      - pg1
      - pg2
    healthcheck:
      test: ["CMD", "haproxy", "-c", "-f", "/usr/local/etc/haproxy/haproxy.cfg"]
      interval: 10s
      timeout: 5s
      retries: 5

  db_init:
    image: postgres:15
    container_name: db_init
    restart: "no"
    env_file:
      - .env
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    entrypoint: >
      bash -e -c "
      echo 'Waiting for PostgreSQL primary through HAProxy...';

      until pg_isready -h db -p 5432 -U $$POSTGRES_USER -d postgres; do
        sleep 2;
      done;

      echo 'Creating database if needed...';

      psql -v ON_ERROR_STOP=1 -h db -p 5432 -U $$POSTGRES_USER -d postgres -tc \"SELECT 1 FROM pg_database WHERE datname = '$$POSTGRES_DB'\" | grep -q 1 ||
      psql -v ON_ERROR_STOP=1 -h db -p 5432 -U $$POSTGRES_USER -d postgres -c \"CREATE DATABASE $$POSTGRES_DB\";

      echo 'Creating metrics user if needed...';

      if ! psql -v ON_ERROR_STOP=1 -h db -p 5432 -U $$POSTGRES_USER -d $$POSTGRES_DB -tAc \"SELECT 1 FROM pg_roles WHERE rolname = '$$METRICS_USER'\" | grep -q 1; then
        psql -v ON_ERROR_STOP=1 -h db -p 5432 -U $$POSTGRES_USER -d $$POSTGRES_DB -c \"CREATE USER $$METRICS_USER WITH PASSWORD '$$METRICS_PASSWORD'\";
      else
        echo 'metrics user already exists';
      fi;

      psql -v ON_ERROR_STOP=1 -h db -p 5432 -U $$POSTGRES_USER -d $$POSTGRES_DB -c \"GRANT pg_monitor TO $$METRICS_USER;\";

      echo 'Database initialization done.';
      "

  db_test:
    image: postgres:15
    restart: always
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "pg_stat_statements.track=all", "-c", "pg_stat_statements.max=10000"]
    env_file:
      - .env
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  seqwall:
    image: ghcr.io/realkarych/seqwall:latest
    platform: linux/amd64
    depends_on:
      db_test:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db_test:5432/${POSTGRES_DB}?sslmode=disable
    volumes:
      - ./migrations:/migrations
      - ./scripts:/scripts
    entrypoint:
      - sh
      - -c
      - |
        apk add --no-cache curl &&
        curl -L https://github.com/golang-migrate/migrate/releases/download/v4.17.0/migrate.linux-amd64.tar.gz | tar xz &&
        mv migrate /usr/local/bin/migrate &&
        chmod +x /usr/local/bin/migrate &&
        exec seqwall "$@"
      - --
    command:
      - staircase
      - --postgres-url
      - postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db_test:5432/${POSTGRES_DB}?sslmode=disable
      - --migrations-path
      - /migrations
      - --migrations-extension
      - .up.sql
      - --upgrade
      - /scripts/ci-up-one.sh
      - --downgrade
      - /scripts/ci-down-one.sh

  migrator:
    image: migrate/migrate
    depends_on:
      seqwall:
        condition: service_completed_successfully
      db_init:
        condition: service_completed_successfully
    env_file:
      - .env
    volumes:
      - ./migrations:/migrations
    command:
      [
        "-path", "/migrations",
        "-database", "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable",
        "up"
      ]

  seeder:
    image: postgres:15
    depends_on:
      migrator:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./seeds:/seeds
    entrypoint: >
      bash -e -c "
      if [ \"$$APP_ENV\" = \"prod\" ]; then
        echo 'Seeding запрещён в prod';
        exit 1;
      fi;

      echo 'Start seeding...';

      psql -v ON_ERROR_STOP=1 -v seed_count=$${SEED_COUNT:-50000} -h db -U $$POSTGRES_USER -d $$POSTGRES_DB -f /seeds/001_users_roles.seed.sql &&
      psql -v ON_ERROR_STOP=1 -v seed_count=$${SEED_COUNT:-50000} -h db -U $$POSTGRES_USER -d $$POSTGRES_DB -f /seeds/002_addresses_sellers.seed.sql &&
      psql -v ON_ERROR_STOP=1 -v seed_count=$${SEED_COUNT:-50000} -h db -U $$POSTGRES_USER -d $$POSTGRES_DB -f /seeds/003_catalog.seed.sql &&
      psql -v ON_ERROR_STOP=1 -v seed_count=$${SEED_COUNT:-50000} -h db -U $$POSTGRES_USER -d $$POSTGRES_DB -f /seeds/004_inventory_cart.seed.sql &&
      psql -v ON_ERROR_STOP=1 -v seed_count=$${SEED_COUNT:-50000} -h db -U $$POSTGRES_USER -d $$POSTGRES_DB -f /seeds/005_orders.seed.sql &&
      psql -v ON_ERROR_STOP=1 -v seed_count=$${SEED_COUNT:-50000} -h db -U $$POSTGRES_USER -d $$POSTGRES_DB -f /seeds/006_lab6_degradation.seed.sql &&
      psql -v ON_ERROR_STOP=1 -h db -U $$POSTGRES_USER -d $$POSTGRES_DB -f /seeds/007_refresh_optimization.seed.sql;

      echo 'Seeding done';
      "

  workload:
    build:
      context: ./workload
    container_name: workload
    restart: always
    depends_on:
      seeder:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATASOURCE_POOL_SIZE: ${WORKLOAD_POOL_SIZE:-20}
      WORKLOAD_SQL_PROFILE: ${WORKLOAD_SQL_PROFILE:-optimized}
    ports:
      - "${WORKLOAD_PORT:-8080}:8080"

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:latest
    restart: always
    depends_on:
      db_init:
        condition: service_completed_successfully
      migrator:
        condition: service_completed_successfully
    environment:
      DATA_SOURCE_NAME: "postgresql://${METRICS_USER}:${METRICS_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable"
    ports:
      - "9187:9187"

  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":${MINIO_CONSOLE_PORT}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_PROMETHEUS_AUTH_TYPE: ${MINIO_PROMETHEUS_AUTH_TYPE}
    ports:
      - "9000:9000"
      - "${MINIO_CONSOLE_PORT}:${MINIO_CONSOLE_PORT}"
    volumes:
      - minio_data:/data

  backup:
    build:
      context: ./backup
    container_name: backup
    depends_on:
      db_init:
        condition: service_completed_successfully
      minio:
        condition: service_started
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BACKUP_ACCESS_KEY: ${MINIO_BACKUP_ACCESS_KEY}
      MINIO_BACKUP_SECRET_KEY: ${MINIO_BACKUP_SECRET_KEY}

      BACKUP_INTERVAL: ${BACKUP_INTERVAL}
      BACKUP_RETENTION_COUNT: ${BACKUP_RETENTION_COUNT}
      BUCKET_BACKUP_NAME: ${BUCKET_BACKUP_NAME}
    volumes:
      - backup_state:/state

  backup_exporter:
    build:
      context: ./backup-exporter
    container_name: backup_exporter
    depends_on:
      - backup
    ports:
      - "8000:8000"
    volumes:
      - backup_state:/state:ro

  prometheus:
    image: prom/prometheus:latest
    restart: always
    depends_on:
      - postgres_exporter
      - workload
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:latest
    restart: always
    depends_on:
      - prometheus
    ports:
      - "3001:3000"
    env_file:
      - .env
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/optimization-dashboards:ro

volumes:
  prometheus_data:
  grafana_data:
  postgres_data:
  minio_data:
  backup_state:

  etcd1-data:
  etcd2-data:
  etcd3-data:
  pg1-data:
  pg2-data:
